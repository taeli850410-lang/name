<!-- 템플릿: 이중 중괄호 자리는 tools/build.py 가 말소리 단어 시각으로 채운다. compositions/ 쪽은 생성물이다. -->
<template>
  <style>
    @font-face { font-family: "Pretendard"; font-weight: 900; src: url("assets/fonts/Pretendard-Black.woff2") format("woff2"); }
    @font-face { font-family: "Pretendard"; font-weight: 800; src: url("assets/fonts/Pretendard-ExtraBold.woff2") format("woff2"); }
    @font-face { font-family: "Pretendard"; font-weight: 700; src: url("assets/fonts/Pretendard-Bold.woff2") format("woff2"); }
    @font-face { font-family: "Pretendard"; font-weight: 500; src: url("assets/fonts/Pretendard-Medium.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; overflow: hidden; font-family: "Pretendard", sans-serif; color: #f7f7f2; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; word-break: keep-all; }
    #root .bg { position: absolute; inset: 0; background: #0b0b0e; }
    #root .cam { position: absolute; inset: 0; }
    #root .line { position: absolute; left: 0; right: 0; text-align: center; white-space: nowrap; }
    #root .y { color: #ffd400; }
    #root .muted { color: #9a9aa3; }
    #root .odo { display: inline-block; line-height: 1; white-space: nowrap; }
    #root .odo-win { display: inline-block; height: 1em; overflow: hidden; vertical-align: top; }
    #root .odo-strip { display: inline-flex; flex-direction: column; }
    #root .odo-strip span, #root .odo-ch { display: block; height: 1em; line-height: 1em; }
    #root .odo-ch { display: inline-block; vertical-align: top; }
    #root .abs { position: absolute; white-space: nowrap; }
    #s08-a-k { left: 100px; top: 236px; font-size: 70px; font-weight: 900; color: #9a9aa3; }
    #root .st { position: absolute; left: 100px; right: 100px; height: 190px; }
    #root .badges { position: absolute; left: 0; top: 0; display: flex; gap: 12px; }
    #root .badge { width: 80px; height: 80px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
      font-size: 46px; font-weight: 900; color: #ffffff; }
    #root .stn { position: absolute; left: 0; top: 96px; font-size: 66px; font-weight: 900; white-space: nowrap; }
    #root .stn small { font-size: 36px; font-weight: 700; color: #9a9aa3; margin-left: 14px; }
    #root .min { position: absolute; right: 0; top: 4px; font-size: 168px; font-weight: 900; line-height: 1; color: #ffd400; }
    #s08-r1 { top: 420px; }
    #s08-r2 { top: 630px; }
    #s08-r3 { top: 840px; }

    #s08-b-k { top: 290px; font-size: 56px; font-weight: 800; color: #9a9aa3; }
    #s08-b-big { top: 410px; font-size: 114px; font-weight: 900; line-height: 1.05; }
    #s08-b-chip { top: 588px; }
    #s08-b-chip span { display: inline-block; background: #ffd400; color: #0b0b0e; font-size: 52px; font-weight: 900; padding: 10px 30px; border-radius: 14px; }
  </style>
  <div id="root" data-composition-id="s08" data-width="1080" data-height="1920">
    <div class="bg"></div>

    <div id="s08-a" class="clip" data-start="0" data-duration="{{b_start}}">
      <div class="cam" id="s08-a-cam">
        <div class="abs" id="s08-a-k">걸어서</div>
        <div class="st" id="s08-r1">
          <div class="badges"><div class="badge" style="background: #00a5de; color: #0b0b0e">4</div><div class="badge" style="background: #cd7c2f">6</div></div>
          <div class="stn">삼각지역<small>220m</small></div>
          <div class="min">3분</div>
        </div>
        <div class="st" id="s08-r2">
          <div class="badges"><div class="badge" style="background: #00a5de; color: #0b0b0e">4</div></div>
          <div class="stn">신용산역</div>
          <div class="min">6분</div>
        </div>
        <div class="st" id="s08-r3">
          <div class="badges"><div class="badge" style="background: #0052a4">1</div></div>
          <div class="stn">용산역</div>
          <div class="min">8분</div>
        </div>
      </div>
    </div>

    <div id="s08-b" class="clip" data-start="{{b_start}}" data-duration="{{b_dur}}">
      <div class="cam" id="s08-b-cam">
        <div class="line" id="s08-b-k">남쪽 정비창 부지</div>
        <div class="line" id="s08-b-big">용산국제업무지구</div>
        <div class="line" id="s08-b-chip"><span>2025.11.27 기공식</span></div>
      </div>
    </div>
  </div>
  <script>
    (function () {
      var tl = gsap.timeline({ paused: true });
      var K = window.KIT;
      // A — 역 이름을 부를 때마다 한 줄씩 하드컷으로 붙는다
      K.words(tl, [document.getElementById("s08-a-k")], 0.05);
      var rows = ["s08-r1", "s08-r2", "s08-r3"];
      var at = [{{r1}}, {{r2}}, {{r3}}];
      for (var i = 0; i < rows.length; i++) {
        var r = document.getElementById(rows[i]);
        K.pop(tl, r.querySelector(".badges"), at[i], 1.3);
        K.words(tl, [r.querySelector(".stn")], at[i] + 0.04);
        K.slam(tl, r.querySelector(".min"), at[i] + 0.3, 1.6);
      }
      // B — 남쪽, 용산국제업무지구 첫 삽
      K.words(tl, [document.getElementById("s08-b-k")], {{b_start}} + 0.09);
      K.slam(tl, document.getElementById("s08-b-big"), {{b_big}}, 1.35);
      K.shake(tl, document.getElementById("s08-b-cam"), {{b_big}} + 0.04, 12);
      K.pop(tl, document.getElementById("s08-b-chip"), {{b_chip}}, 1.25);
      window.__timelines["s08"] = tl;
    })();
  </script>
</template>
