<!-- 템플릿: 이중 중괄호 자리는 tools/build.py 가 말소리 단어 시각으로 채운다. compositions/ 쪽은 생성물이다. -->
<template>
  <style>

    #root { position: absolute; inset: 0; overflow: hidden; font-family: "Pretendard", sans-serif; color: #f7f7f2; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; word-break: keep-all; }
    #root .bg { position: absolute; inset: 0; background: #0b0b0e; }
    #root .cam { position: absolute; inset: 0; }
    #root .line { position: absolute; left: 0; right: 0; text-align: center; white-space: nowrap; }
    #root .y { color: #ffd400; }
    #root .muted { color: #9a9aa3; }
    #root .odo { display: inline-block; line-height: 1; white-space: nowrap; }
    #root .odo-win { display: inline-block; height: 1em; overflow: hidden; vertical-align: top; }
    #root .odo-strip { display: inline-flex; flex-direction: column; }
    #root .odo-strip span, #root .odo-ch { display: block; height: 1em; line-height: 1em; }
    #root .odo-ch { display: inline-block; vertical-align: top; }
    #s02-w1 { top: 400px; font-size: 176px; font-weight: 900; line-height: 1; }
    #s02-w2 { top: 610px; font-size: 200px; font-weight: 900; line-height: 1; color: #ffd400; }
    #s02-w3 { top: 840px; font-size: 200px; font-weight: 900; line-height: 1; }
    #s02-b-k1 { top: 290px; font-size: 84px; font-weight: 800; color: #9a9aa3; }
    #s02-b-k2 { top: 390px; font-size: 150px; font-weight: 900; line-height: 1; }
    #s02-doc { position: absolute; left: 110px; top: 610px; width: 860px; height: 440px; }
    #s02-paper { position: absolute; inset: 0; background: #f2efe6; border-radius: 10px; transform: rotate(-2.5deg);
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55); padding: 40px 48px; color: #1a1a1d; }
    #s02-paper .org { font-size: 30px; font-weight: 700; color: #6b6b72; }
    #s02-paper .ttl { position: relative; margin-top: 14px; font-size: 44px; font-weight: 900; line-height: 1.25; }
    #s02-hilite { position: absolute; left: -6px; right: 40px; bottom: 2px; height: 26px; background: #ffd400; transform-origin: 0 50%; }

  </style>
  <div id="root" data-composition-id="s02" data-width="1080" data-height="1920">
    <div class="bg"></div>

    <div id="s02-a" class="clip" data-start="0" data-duration="{{b_start}}">
      <div class="cam" id="s02-a-cam">
        <div class="line" id="s02-w1">상가로도</div>
        <div class="line" id="s02-w2">아파트가</div>
        <div class="line" id="s02-w3">나올까?</div>
      </div>
    </div>

    <div id="s02-b" class="clip" data-start="{{b_start}}" data-duration="{{b_dur}}">
      <div class="cam">
        <div class="line" id="s02-b-k1">답은</div>
        <div class="line" id="s02-b-k2">조합 <span class="y">추산서</span></div>

        </div>

  <script>
    (function () {
      var tl = gsap.timeline({ paused: true });
      var K = window.KIT;
      // A — 질문을 한 단어씩 하드컷으로 쌓는다
      K.pop(tl, document.getElementById("s02-w1"), {{w1}}, 1.18);
      K.pop(tl, document.getElementById("s02-w2"), {{w2}}, 1.22);
      K.pop(tl, document.getElementById("s02-w3"), {{w3}}, 1.22);
      K.shake(tl, document.getElementById("s02-a-cam"), {{w3}} + 0.02, 10);
      // B — 답: 조합 추산서. 문서가 휙 들어와 선다
      K.pop(tl, document.getElementById("s02-b-k1"), {{b_start}});
      K.words(tl, document.querySelectorAll("#s02-b-k2"), {{k2}});
      tl.fromTo("#s02-doc", { x: 520, opacity: 0, filter: "blur(16px)" }, { x: 0, opacity: 1, filter: "blur(0px)", duration: 0.32, ease: "expo.out" }, {{b_start}} + 0.08);
      tl.fromTo("#s02-hilite", { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power3.out" }, {{hilite}});
      window.__timelines["s02"] = tl;
    })();
  </script>
</template>
