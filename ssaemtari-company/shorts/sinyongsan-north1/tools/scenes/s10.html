<!-- 템플릿: 이중 중괄호 자리는 tools/build.py 가 말소리 단어 시각으로 채운다. compositions/ 쪽은 생성물이다. -->
<template>
  <style>
    @font-face { font-family: "Pretendard"; font-weight: 900; src: url("assets/fonts/Pretendard-Black.woff2") format("woff2"); }
    @font-face { font-family: "Pretendard"; font-weight: 800; src: url("assets/fonts/Pretendard-ExtraBold.woff2") format("woff2"); }
    @font-face { font-family: "Pretendard"; font-weight: 700; src: url("assets/fonts/Pretendard-Bold.woff2") format("woff2"); }
    @font-face { font-family: "Pretendard"; font-weight: 500; src: url("assets/fonts/Pretendard-Medium.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; overflow: hidden; font-family: "Pretendard", sans-serif; color: #f7f7f2; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; word-break: keep-all; }
    #root .bg { position: absolute; inset: 0; background: #0b0b0e; }
    #root .cam { position: absolute; inset: 0; }
    #root .line { position: absolute; left: 0; right: 0; text-align: center; white-space: nowrap; }
    #root .y { color: #ffd400; }
    #root .muted { color: #9a9aa3; }
    #root .odo { display: inline-block; line-height: 1; white-space: nowrap; }
    #root .odo-win { display: inline-block; height: 1em; overflow: hidden; vertical-align: top; }
    #root .odo-strip { display: inline-flex; flex-direction: column; }
    #root .odo-strip span, #root .odo-ch { display: block; height: 1em; line-height: 1em; }
    #root .odo-ch { display: inline-block; vertical-align: top; }
    /* A — 연락 안내(노란 화면) */
    #s10-a-bg { position: absolute; inset: 0; background: #ffd400; }
    #s10-a-cam { color: #0b0b0e; }
    #s10-a-k { top: 330px; font-size: 76px; font-weight: 800; }
    #s10-a-k span { display: inline-block; margin: 0 0.12em; }
    #s10-a-big { top: 440px; font-size: 196px; font-weight: 900; line-height: 1; letter-spacing: -0.05em; }
    #s10-a-tel { top: 700px; }
    #s10-a-tel span { display: inline-block; background: #0b0b0e; color: #ffd400; font-size: 100px; font-weight: 900; line-height: 1;
      padding: 26px 46px 30px; border-radius: 28px; letter-spacing: -0.01em; }
    #s10-a-co { top: 908px; font-size: 50px; font-weight: 900; }
    #s10-a-ag { top: 978px; font-size: 42px; font-weight: 700; }

    /* B — 끝 화면: 명함 + 매물 표시 사항 + 고지. 아래쪽 오른편은 앱 버튼 자리라 오른쪽 여백을 넓게 둔다 */
    #s10-b { --gold: #c9ab6c; }
    #s10-b-office { position: absolute; left: 90px; right: 90px; top: 252px; }
    #s10-b-co { font-size: 46px; font-weight: 900; line-height: 1.2; color: var(--gold); white-space: nowrap; }
    #s10-b-rule { height: 3px; margin-top: 14px; background: var(--gold); transform-origin: 0 50%; }
    #s10-b-name { display: flex; align-items: baseline; gap: 30px; margin-top: 14px; }
    #s10-b-name b { font-size: 76px; font-weight: 900; line-height: 1.1; letter-spacing: 0.22em; }
    #s10-b-name span { font-size: 40px; font-weight: 700; }
    #s10-b-contact { display: grid; grid-template-columns: 170px 1fr; row-gap: 2px; margin-top: 12px; align-items: baseline; }
    #s10-b-contact .k { font-size: 30px; font-weight: 700; color: #c9c9cf; }
    #s10-b-contact .v { font-size: 38px; font-weight: 800; letter-spacing: 0; }
    #s10-b-contact .v.mail { font-size: 34px; }
    #s10-b-addr { margin-top: 12px; font-size: 30px; font-weight: 700; }
    #s10-b-reg { margin-top: 8px; font-size: 28px; font-weight: 700; color: #c9c9cf; }
    #s10-b-fr { margin-top: 8px; font-size: 28px; font-weight: 500; color: #9a9aa3; letter-spacing: 0; }

    #s10-b-prop { position: absolute; left: 90px; right: 130px; top: 704px; }
    #s10-b-t { font-size: 38px; font-weight: 900; color: var(--gold); }
    #s10-b-rule2 { height: 2px; margin-top: 12px; background: #3a3a42; }
    #s10-b-list { display: flex; flex-direction: column; gap: 4px; margin-top: 14px; }
    #s10-b-list .r { display: grid; grid-template-columns: 160px 1fr; align-items: baseline; }
    #s10-b-list .k { font-size: 28px; font-weight: 700; color: #9a9aa3; }
    #s10-b-list .v { font-size: 30px; font-weight: 800; line-height: 1.3; }
    #s10-b-note { margin-top: 16px; font-size: 28px; font-weight: 500; color: #9a9aa3; line-height: 1.4; letter-spacing: -0.03em; }
    #s10-b-blog { margin-top: 8px; font-size: 28px; font-weight: 700; color: #c9c9cf; }
  </style>
  <div id="root" data-composition-id="s10" data-width="1080" data-height="1920">
    <div class="bg"></div>

    <div id="s10-a" class="clip" data-start="0" data-duration="{{b_start}}">
      <div id="s10-a-bg"></div>
      <div class="cam" id="s10-a-cam">
        <div class="line" id="s10-a-k"><span>자세한 정보를</span><span>알고 싶으시면</span></div>
        <div class="line" id="s10-a-big">연락주세요</div>
        <div class="line" id="s10-a-tel"><span>[[mobile]]</span></div>
        <div class="line" id="s10-a-co">[[name]]</div>
        <div class="line" id="s10-a-ag">[[agent]] [[agent_title]]</div>
      </div>
    </div>

    <div id="s10-b" class="clip" data-start="{{b_start}}" data-duration="{{b_dur}}">
      <div class="cam" id="s10-b-cam">
        <div id="s10-b-office">
          <div id="s10-b-co">[[name]]</div>
          <div id="s10-b-rule"></div>
          <div id="s10-b-name"><b>[[agent]]</b><span>[[agent_title]]</span></div>
          <div id="s10-b-contact">
            <span class="k">Mobile</span><span class="v">[[mobile]]</span>
            <span class="k">Direct</span><span class="v">[[direct]]</span>
            <span class="k">E-mail</span><span class="v mail">[[email]]</span>
          </div>
          <div id="s10-b-addr">[[address]]</div>
[[reg_html]]
          <div id="s10-b-fr">[[franchise_note]]</div>
        </div>

        <div id="s10-b-prop">
          <div id="s10-b-t">매물 정보</div>
          <div id="s10-b-rule2"></div>
          <div id="s10-b-list">
            <div class="r"><span class="k">소재지</span><span class="v">서울 용산구 한강로2가 (신용산역 북측 제1구역)</span></div>
            <div class="r"><span class="k">종류</span><span class="v">제2종근린생활시설 1층 · 일반상업지역</span></div>
            <div class="r"><span class="k">면적</span><span class="v">대지 12.56㎡(3.80평) · 건물 28.22㎡</span></div>
            <div class="r"><span class="k">사용승인</span><span class="v">2008.04.23</span></div>
            <div class="r"><span class="k">거래</span><span class="v">매매 19억 5,000만 원</span></div>
            <div class="r"><span class="k">신청 평형</span><span class="v">115A (조합원 분양신청)</span></div>
          </div>
          <div id="s10-b-note">※ 종전자산 평가액·비례율·권리가액·분담금은 조합 추산서 기준 예시이며, 관리처분계획 수립·인가 과정에서 바뀔 수 있습니다. 이자·이주비·취득세 미포함. 프리미엄 한계선은 상한이지 목표가가 아닙니다. 실거래: 국토교통부 공개자료<span style="white-space: nowrap">(해제·직거래 제외)</span>. 내레이션: 실제 목소리 기반 AI 합성 음성.</div>
          <div id="s10-b-blog">[[blog_name]] 블로그 · [[blog]]</div>
        </div>
      </div>
    </div>
  </div>
  <script>
    (function () {
      var tl = gsap.timeline({ paused: true });
      var K = window.KIT;
      var kk = document.querySelectorAll("#s10-a-k span");
      K.words(tl, [kk[0]], {{k1}});
      K.words(tl, [kk[1]], {{k2}});
      K.slam(tl, document.getElementById("s10-a-big"), {{big}}, 1.9);
      K.shake(tl, document.getElementById("s10-a-cam"), {{big}} + 0.04, 22);
      // 전화번호가 찍히고, 사무소·이름이 뒤따른다
      K.pop(tl, document.getElementById("s10-a-tel"), {{big}} + 0.15, 1.3);
      K.words(tl, document.querySelectorAll("#s10-a-co, #s10-a-ag"), {{big}} + 0.35, 0.1);
      // B — 끝 화면. 명함이 먼저, 매물 표시 사항이 이어서. 3초 넘게 그대로 선다
      K.words(tl, [document.getElementById("s10-b-co")], {{b_start}} + 0.05);
      tl.fromTo("#s10-b-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "power3.out" }, {{b_start}} + 0.08);
      K.words(tl, document.querySelectorAll("#s10-b-name, #s10-b-contact, #s10-b-addr, #s10-b-reg, #s10-b-fr"), {{b_start}} + 0.14, 0.05);
      K.words(tl, document.querySelectorAll("#s10-b-t, #s10-b-rule2, #s10-b-list .r, #s10-b-note, #s10-b-blog"), {{b_start}} + 0.4, 0.04);
      window.__timelines["s10"] = tl;
    })();
  </script>
</template>
